[project]
name = "fastapi-otel-learning-env"
version = "0.1.0"
description = "Distributed FastAPI + OpenSearch + RabbitMQ playground for learning OpenTelemetry workflows."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "kacper481"}]
keywords = ["opentelemetry", "observability", "fastapi", "tracing", "learning"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
]

dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "httpx==0.27.2",
    "opensearch-py==2.7.1",
    "aio-pika==9.5.0",
    "slowapi==0.1.9",
    "pydantic[email]==2.9.2",
    "pydantic-settings==2.6.1",
    "structlog==24.4.0",
    "python-dotenv==1.0.1",
    "opentelemetry-api==1.28.2",
    "opentelemetry-sdk==1.28.2",
    "opentelemetry-instrumentation-fastapi==0.49b2",
    "opentelemetry-instrumentation-httpx==0.49b2",
    "opentelemetry-instrumentation-requests==0.49b2",
    "opentelemetry-instrumentation-logging==0.49b2",
    "opentelemetry-instrumentation-aio-pika==0.49b2",
    "opentelemetry-exporter-otlp-proto-grpc==1.28.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.7", "pre-commit>=4.0"]

[project.urls]
Repository = "https://github.com/kacper481/test"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["common*", "services*", "tools*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RUF"]
ignore = [
    "E501",   # line length handled by formatter
    "B008",   # FastAPI Depends() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM117"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning:opentelemetry.*",
]
