x-app-base: &app-base
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  environment: &app-env
    OPENSEARCH_HOST: http://opensearch:9200
    OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4317
    AMQP_URL: amqp://guest:guest@rabbitmq:5672/
    LOG_LEVEL: INFO
  mem_limit: 256m
  depends_on:
    opensearch:
      condition: service_healthy
    otel-collector:
      condition: service_started
    rabbitmq:
      condition: service_healthy

services:
  # ===== Infra =========================================================
  opensearch:
    image: opensearchproject/opensearch:2.13.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    mem_limit: 1g
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management
    mem_limit: 512m
    ports:
      - "5672:5672"    # AMQP
      - "15672:15672"  # Management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    mem_limit: 512m
    ports:
      - "16686:16686"   # UI
      - "4317"           # OTLP gRPC (internal)

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.112.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    mem_limit: 256m
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8889:8889"
    depends_on:
      - jaeger

  prometheus:
    image: prom/prometheus:v2.55.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    mem_limit: 512m
    ports: ["9090:9090"]
    depends_on: [otel-collector]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_AUTH_DISABLE_LOGIN_FORM=true
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    mem_limit: 256m
    ports: ["3001:3000"]
    depends_on: [prometheus]

  # ===== App services ==================================================
  items-svc:
    <<: *app-base
    command: ["uvicorn", "services.items_svc.main:app", "--host", "0.0.0.0", "--port", "8001"]
    environment:
      <<: *app-env
      # Exercise toggles — uncomment to enable
      # CHAOS_ITEMS_SEARCH_MS: "300"
      # CHAOS_OS_INDEX_SLOW_MS: "150"
    ports: ["8001:8001"]

  users-svc:
    <<: *app-base
    command: ["uvicorn", "services.users_svc.main:app", "--host", "0.0.0.0", "--port", "8002"]
    environment:
      <<: *app-env
      # CHAOS_USERS_GET_ERROR_RATE: "0.15"
    ports: ["8002:8002"]

  gateway:
    <<: *app-base
    command: ["uvicorn", "services.gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      <<: *app-env
      ITEMS_SVC_URL: http://items-svc:8001
      USERS_SVC_URL: http://users-svc:8002
      # CHAOS_GATEWAY_VALIDATE_MS: "80"
    ports: ["8000:8000"]
    depends_on:
      opensearch:
        condition: service_healthy
      otel-collector:
        condition: service_started
      rabbitmq:
        condition: service_healthy
      items-svc:
        condition: service_started
      users-svc:
        condition: service_started

  notifications-svc:
    <<: *app-base
    command: ["python", "-m", "services.notifications_svc.worker"]
    # No ports — async worker only

  # ===== Continuous traffic generator ===================================
  loadgen:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    command: ["python", "-m", "tools.loadgen"]
    environment:
      GATEWAY_URL: http://gateway:8000
      RPS: "3"
      SCENARIO: steady    # steady | read_heavy | write_heavy | spike
    mem_limit: 128m
    depends_on:
      gateway:
        condition: service_started
